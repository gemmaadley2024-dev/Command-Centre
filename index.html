<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Command Centre" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>Command Centre Personal OS</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="logo">CC</div><div><h1>Command Centre</h1><p>Personal OS</p></div></div>
      <nav id="nav"></nav>
      <button class="ghost danger" id="clearData">Clear all data</button>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><p class="eyebrow" id="todayText"></p><h2 id="pageTitle">Dashboard</h2></div>
        <div class="quick-add">
          <input id="quickInput" placeholder="Quick add: Fuel £60, meeting tomorrow 10am, call Sarah..." />
          <button id="quickAddBtn">Add</button><button class="ghost" id="commandBtn" title="Open command palette">⌘</button><button class="ghost" id="themeBtn" title="Toggle theme">☾</button>
        </div>
      </header>
      <section id="view"></section><div id="toast" class="toast hidden"></div>
    </main>
  </div>
  <div id="modal" class="modal hidden"><div class="modal-card"><button class="close" id="closeModal">×</button><div id="modalContent"></div></div></div>
  <script src="./app.js"></script>
</body>
</html>
